# ============================================================
#  HTTP → HTTPS Redirect
# ============================================================

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # ACME challenge (Let's Encrypt renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}