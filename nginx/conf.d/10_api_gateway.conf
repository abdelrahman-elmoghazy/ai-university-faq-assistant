# ============================================================
#  HTTPS API Gateway
#  Reverse proxy → auth-service (internal_net only)
# ============================================================

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name localhost;        # ← Local testing

    # ── SSL Certificates ─────────────────────────────────
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_dhparam         /etc/nginx/certs/dhparam.pem;

    # ── HSTS ─────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Content Security Policy ───────────────────────────
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none';" always;

    # ── RabbitMQ Management UI ────────────────────────────
    location /rabbitmq/ {
        auth_basic           "RabbitMQ Admin";
        auth_basic_user_file /etc/nginx/certs/.htpasswd;

    # Removed limit_req to allow UI assets to load

        proxy_pass         http://rabbitmq_mgmt/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_redirect     off;
        proxy_buffering    off;
    }


    # ── Health Check (no rate limit, no auth) ─────────────
    location = /health {
        proxy_pass         http://auth_service/health;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        access_log         off;
    }

    # ── Auth Endpoints (register / oauth) ─────────────────
    location ~ ^/api/auth/(register|google|github) {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass         http://auth_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Strip any attempt to inject internal API key from outside
        proxy_set_header   X-Internal-API-Key "";
    }

    # ── Login Endpoint (strictest rate limit) ─────────────
    location = /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;

        proxy_pass         http://auth_service/api/auth/login;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_set_header   X-Internal-API-Key "";
    }

    # ── FAQ Service Endpoints ─────────────────────────────
    location /api/faq/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass         http://faq_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Prevent external callers from spoofing the internal key
        proxy_set_header   X-Internal-API-Key "";

        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
    }

    # ── File Upload Endpoints (Team Member 5) ────────────────
    location /api/files/ {
        limit_req zone=api_limit burst=5 nodelay;
        client_max_body_size 20m;   # Allow larger uploads

        proxy_pass         http://faq_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_set_header   X-Internal-API-Key "";

        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;
    }

    # ── Admin Dashboard API (Team Member 5) ──────────────────
    location /api/admin/ {
        limit_req zone=api_limit burst=10 nodelay;

        # Try FAQ service first for admin stats/files/audit
        proxy_pass         http://faq_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_set_header   X-Internal-API-Key "";

        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;

        # Fallback to auth service if FAQ service returns 404
        proxy_intercept_errors on;
        error_page 404 = @admin_auth_fallback;
    }

    location @admin_auth_fallback {
        proxy_pass         http://auth_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Internal-API-Key "";
    }

    # ── All Other /api/* Endpoints ────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass         http://auth_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Prevent external callers from spoofing the internal key
        proxy_set_header   X-Internal-API-Key "";

        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
    }

    # ── Block everything else ─────────────────────────────
    location / {
        return 404;
    }

    # ── Custom error pages ────────────────────────────────
    error_page 429 /429.json;
    location = /429.json {
        internal;
        default_type application/json;
        return 429 '{"error":"Too Many Requests","message":"Rate limit exceeded. Please slow down."}';
    }

    error_page 502 503 504 /50x.json;
    location = /50x.json {
        internal;
        default_type application/json;
        return 502 '{"error":"Service Unavailable","message":"The service is temporarily unavailable."}';
    }
}