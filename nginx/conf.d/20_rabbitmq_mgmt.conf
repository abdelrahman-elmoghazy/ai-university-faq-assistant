# ============================================================
#  RabbitMQ Management UI — Protected Proxy
#  Accessible at https://yourdomain.com/rabbitmq/
#  Protected by HTTP Basic Auth (admin only)
# ============================================================

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name admin.yourdomain.com;    # ← separate subdomain recommended

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_dhparam         /etc/nginx/certs/dhparam.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Allow only specific IPs (office / VPN) ───────────
    # Uncomment and adjust for production:
    # allow 203.0.113.0/24;   # office CIDR
    # deny  all;

    location /rabbitmq/ {
        # HTTP Basic Auth — generated with: htpasswd -nb admin PASSWORD
        auth_basic           "RabbitMQ Admin";
        auth_basic_user_file /etc/nginx/certs/.htpasswd;

        limit_req zone=auth_limit burst=3 nodelay;

        proxy_pass         http://rabbitmq_mgmt/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for RabbitMQ Management rewrite
        proxy_redirect     off;
        proxy_buffering    off;
    }

    location / {
        return 403;
    }
}