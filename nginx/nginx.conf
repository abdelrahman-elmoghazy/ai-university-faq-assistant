# ============================================================
#  Nginx Main Configuration
#  API Gateway — AI University FAQ Assistant
# ============================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    # ── Performance ──────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;          # Hide nginx version

    # ── Request Limits ───────────────────────────────────
    client_max_body_size    10m;
    client_body_timeout     12s;
    client_header_timeout   12s;
    send_timeout            10s;
    large_client_header_buffers 4 8k;

    # ── Rate Limiting Zones ───────────────────────────────
    # General API: 30 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

    # Auth endpoints: 10 requests/minute (stricter — brute-force protection)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    # Login: 5 attempts/minute
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # Return 429 on rate limit (not 503)
    limit_req_status  429;
    limit_conn_status 429;

    # ── SSL Global Defaults ───────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # ── Security Headers (applied globally) ───────────────
    add_header X-Frame-Options           "DENY"            always;
    add_header X-Content-Type-Options    "nosniff"         always;
    add_header X-XSS-Protection          "1; mode=block"   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()" always;

    # ── Upstream — Auth Service ───────────────────────────
    upstream auth_service {
        server auth-service:5000;
        keepalive 16;
    }

    # ── Upstream — RabbitMQ Management ───────────────────
    upstream rabbitmq_mgmt {
        server rabbitmq:15672;
    }

    # Include virtual host configs
    include /etc/nginx/conf.d/*.conf;
}