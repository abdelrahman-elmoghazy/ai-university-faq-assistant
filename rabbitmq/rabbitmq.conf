# ============================================================
#  RabbitMQ Secure Configuration
#  - Disables guest/guest default account
#  - Restricts loopback access
#  - Loads definitions from file (users, vhosts, permissions)
# ============================================================

# Load definitions on startup (users, exchanges, queues, permissions)
management.load_definitions = /etc/rabbitmq/definitions.json

# Disable guest user (guest can only connect from localhost by default,
# but we remove it entirely via definitions)
loopback_users = none

# Force all connections to supply credentials
default_user = REPLACED_BY_ENV
default_pass = REPLACED_BY_ENV

# Heartbeat — detect dead connections faster
heartbeat = 60

# Max message size: 128 MB
max_message_size = 134217728

# Management plugin
management.tcp.port = 15672
management.tcp.ip   = 0.0.0.0

# Logging
log.console          = true
log.console.level    = warning
log.file             = false