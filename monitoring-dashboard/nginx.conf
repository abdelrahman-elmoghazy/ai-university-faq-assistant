server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to logging service API (avoids CORS in browser)
    location /api/ {
        proxy_pass         http://logging-service:5002/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /internal/ {
        proxy_pass         http://logging-service:5002/internal/;
        proxy_set_header   Host $host;
    }
}
