version: "3.9"

# ============================================================
#  AI University FAQ Assistant — Full Stack
#  Member 2: API Gateway & DevOps
# ============================================================

services:

  # ────────────────────────────────────────────────────────
  #  NGINX — API Gateway / Reverse Proxy
  # ────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: api_gateway
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP  → redirect to HTTPS
      - "443:443"     # HTTPS → public entry point
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      auth-service:
        condition: service_healthy
    networks:
      - public_net
      - internal_net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ────────────────────────────────────────────────────────
  #  AUTH SERVICE  (Member 1 — untouched)
  # ────────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth_service
    restart: unless-stopped
    expose:
      - "5000"          # NOT published to host — only reachable inside internal_net
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HOST: 0.0.0.0
      PORT: 5000
    volumes:
      - auth_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ────────────────────────────────────────────────────────
  #  FAQ SERVICE
  # ────────────────────────────────────────────────────────
  faq-service:
    build:
      context: ./faq-service
      dockerfile: Dockerfile
    container_name: faq_service
    restart: unless-stopped
    expose:
      - "5001"
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      HOST: 0.0.0.0
      PORT: 5001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ────────────────────────────────────────────────────────
  #  POSTGRESQL
  # ────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    expose:
      - "5432"          # Internal only
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────────────────
  #  RABBITMQ — Secure Setup (no guest/guest)
  # ────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    expose:
      - "5672"    # AMQP — internal only
      - "15672"   # Management UI — internal only (proxied via Nginx with auth)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_CONFIG_FILE: /etc/rabbitmq/rabbitmq.conf
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ────────────────────────────────────────────────────────
  #  LOGGING SERVICE  (Member 3)
  # ────────────────────────────────────────────────────────
  logging-service:
    build:
      context: ./logging-service
      dockerfile: Dockerfile
    container_name: logging_service
    restart: unless-stopped
    expose:
      - "5002"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HOST: 0.0.0.0
      PORT: 5002
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ────────────────────────────────────────────────────────
  #  WORKER SERVICE  (Member 3)
  # ────────────────────────────────────────────────────────
  worker-service:
    build:
      context: ./worker-service
      dockerfile: Dockerfile
    container_name: worker_service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      LOGGING_SERVICE_URL: http://logging-service:5002
      LOG_LEVEL: INFO
    depends_on:
      rabbitmq:
        condition: service_healthy
      logging-service:
        condition: service_healthy
    networks:
      - internal_net

  # ────────────────────────────────────────────────────────
  #  MONITORING DASHBOARD  (Member 3)
  # ────────────────────────────────────────────────────────
  monitoring-dashboard:
    build:
      context: ./monitoring-dashboard
      dockerfile: Dockerfile
    container_name: monitoring_dashboard
    restart: unless-stopped
    ports:
      - "8080:80"      # Access at http://localhost:8080
    depends_on:
      logging-service:
        condition: service_healthy
    networks:
      - internal_net
      - public_net

# ────────────────────────────────────────────────────────
#  NETWORKS
# ────────────────────────────────────────────────────────
networks:
  public_net:
    driver: bridge
    name: public_net

  internal_net:
    driver: bridge
    internal: true        # No outbound internet from internal services
    name: internal_net

# ────────────────────────────────────────────────────────
#  VOLUMES
# ────────────────────────────────────────────────────────
volumes:
  postgres_data:
  rabbitmq_data:
  auth_logs:
  nginx_logs: